(function () {
  if (window.__hyZoomFix) return; window.__hyZoomFix = 1;
  const P = Element.prototype, nat = P.getBoundingClientRect;
  let cal = null;
  function calibrate() {
    if (cal) return cal;
    if (!document.body) return { ok: true };
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:300px;top:200px;width:100px;height:100px;zoom:0.5;visibility:hidden;pointer-events:none;';
    const a = document.createElement('div'), b = document.createElement('div');
    a.style.cssText = 'position:absolute;left:40px;top:40px;width:10px;height:10px;';
    b.style.cssText = 'position:absolute;left:200px;top:200px;width:10px;height:10px;';

    const ra = nat.call(a), rb = nat.call(b), rx = nat.call(box);
    box.remove();
    // 真正位置：a 在 (300+20, 200+20)，b 在 (300+100, 200+100)，寬 5。
    const Ax = (rb.left - ra.left) / 80, Ay = (rb.top - ra.top) / 80;
    if (Math.abs(Ax - 1) < 0.05 && Math.abs(Ay - 1) < 0.05) return (cal = { ok: true });

    const k = Math.log(Ax) / Math.log(2);
    cal = { ok: false, k: k > 0.05 ? k : 1, ox: Math.abs(1 - Ax) > 1e-6 ? Bx / (1 - Ax) : 0, oy: Math.abs(1 - Ay) > 1e-6 ? By / (1 - Ay) : 0, self: Math.abs(rx.width - 50) > 2 };
    return cal;
  }
  P.getBoundingClientRect = function () {
    const r = nat.call(this), c = calibrate();
    if (c.ok) return r;
    let z = 1, el = c.self ? this : this.parentElement;
    while (el && el.nodeType === 1) { const v = parseFloat(getComputedStyle(el).zoom); if (v && v !== 1) z *= v; el = el.parentElement; }
    if (Math.abs(z - 1) < 0.001) return r;
    z = Math.pow(z, c.k);
    const x = (r.left - c.ox) * z + c.ox, y = (r.top - c.oy) * z + c.oy;
    return new DOMRect(x, y, r.width * z, r.height * z);

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

script>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>/* cleared for bundling */\n<\u002Fstyle>\n  <style>/* HuanYin 弦吟 — colour tokens.\n   Source: uploads/fingerboard analysis.pptx (「指板分析」教學課程投影片，20 頁) — this palette is\n   extracted directly from that deck's actual slide colours, not estimated or invented.\n   Cream/charcoal ground with a single warm amber accent family; no forest green, no indigo. */\n:root{\n  /* ── 中性色 neutrals — 米色/炭色 cream & charcoal from the deck's own slides ── */\n  --canvas:#FAF6EF;\n  --surface-bone:#F0E7D8;\n  --surface-card:#ffffff;\n  --ink:#2E2622;\n  --body:#3F3630;\n  --mute:#6B5B4E;\n  --stone:#C9B9A3;\n  --hairline:rgba(46,38,34,0.12);\n\n  /* ── 深色區塊 stage / night — derived darker steps of --ink for dark panels ── */\n  --surface-dark:#1C1611;\n  --surface-deep:#120E0A;\n  --on-dark:#FAF6EF;\n  --on-dark-mute:rgba(250,246,239,0.72);\n\n  /* ── 主色｜琥珀 amber — the deck's dominant accent (#D97706 / #B45309) ─────── */\n  --primary:#D97706;\n  --primary-deep:#B45309;\n\n  /* ── 副色｜靛藍 indigo — user-preferred cool tone reintroduced from the original palette;\n     NOT from the fingerboard deck (deck is warm-only) — kept because amber/rust/gold read as one\n     repetitive warm family for a three-role split, and the user asked to keep this cool anchor. */\n  --secondary:#26314F;\n  --secondary-deep:#1A2138;\n\n  /* ── 簽名色｜金褐 deep gold — a third warm step seen on tags/labels in the deck ── */\n  --accent:#C98A2A;\n  --accent-deep:#9C6B1D;\n\n  /* ── 额外可選｜松綠 forest · 赭紅 rust — also user-preferred, kept as optional extra tones\n     (not one of the three core roles) so both liked colours stay available. ── */\n  --forest:#1B4B3A;\n  --forest-deep:#123529;\n  --rust:#C2410C;\n  --rust-deep:#9A3412;\n\n  /* ── 語意色 semantic (Gumroad 交易頁 only) ─────── */\n  --success:#2c7a7b;\n  --success-tint:#e1e4d7;\n  --success-deep:#215b5c;\n  --danger:#C00000;\n  --danger-deep:#7F1D1D;\n\n  --link:#B45309;\n  --ring-focus:rgba(180,83,9,0.45);\n  --text-strong:var(--ink);\n  --text-body:var(--body);\n  --text-mute:var(--mute);\n  --text-faint:var(--stone);\n  --text-on-dark:var(--on-dark);\n  --text-on-dark-mute:var(--on-dark-mute);\n  --text-link:var(--link);\n  --text-accent:var(--accent-deep);\n\n  --bg-page:var(--canvas);\n  --bg-sunk:var(--surface-bone);\n  --bg-card:var(--surface-card);\n  --bg-stage:var(--surface-dark);\n  --bg-stage-deep:var(--surface-deep);\n  --bg-forest:var(--primary);\n\n  --border-hairline:var(--hairline);\n  --border-strong:rgba(46,38,34,0.28);\n  --border-on-dark:rgba(250,246,239,0.18);\n}\n<\u002Fstyle>\n  <style>:root{\n  /* families — from uploads/fingerboard analysis.pptx's own slide masters: Barlow Condensed\n     for display, Barlow for UI/body, Noto Sans TC for Chinese in both roles. No serif, no kai —\n     this source is a clean teaching deck, not a literary/programme-note register.\n     COMBINED stacks below (Barlow first, Noto Sans TC fallback) are for ON-SCREEN use only —\n     browsers resolve per-glyph fallback correctly. PPTX export does NOT: it writes whatever\n     font-family string is computed into BOTH <a:latin> and <a:ea> for an entire run, so a run\n     styled with the combined stack gets tagged Barlow even where it's pure Chinese text —\n     opening it in PowerPoint and touching the text reflows it in PowerPoint's own CJK default.\n     Any deck/template meant for PPTX export MUST use the SINGLE-family tokens below\n     (--font-cjk / --font-latin / --font-latin-display) on separate spans per script —\n     never the combined --font-display/--font-ui/--font-kai/--font-mono stacks for slide text. */\n  --font-display:\"Barlow Condensed\",\"Noto Sans TC\",sans-serif;   /* on-screen only — 標題、海報、大字級 */\n  --font-kai:\"Barlow\",\"Noto Sans TC\",sans-serif;                 /* on-screen only — italic lede/quote register */\n  --font-ui:\"Barlow\",\"Noto Sans TC\",system-ui,sans-serif;        /* on-screen only — 介面、按鈕、表單、說明 */\n  --font-mono:\"Barlow\",\"Noto Sans TC\",sans-serif;                /* on-screen only — Capo / 弦數 / 拍號 / 時間碼 / 價格 */\n\n  /* SINGLE-family tokens — REQUIRED for any text in a deck/template that will be exported to\n     PPTX. Put Chinese runs in --font-cjk, Latin/number runs in --font-latin (or\n     --font-latin-display for the condensed headline face), each in its OWN span. Never mix\n     scripts inside one span when authoring for export. */\n  --font-cjk:\"Noto Sans TC\",sans-serif;\n  --font-latin:\"Barlow\",sans-serif;\n  --font-latin-display:\"Barlow Condensed\",sans-serif;\n\n  /* scale — 1rem = 16px. Recalibrated directly from slide1.xml's run sizes:\n     eyebrow/meta 16.5pt, CJK subtitle 22.5pt, lede 20.25pt, byline name 28.5pt, hero title 111pt —\n     read relative to the eyebrow as 1x, the hero title comes out to ~6.7x. */\n  --text-2xs:0.75rem;\n  --text-xs:0.8125rem;\n  --text-sm:0.9375rem;\n  --text-base:1rem;\n  --text-lg:1.25rem;\n  --text-xl:1.375rem;\n  --text-2xl:1.75rem;\n  --text-3xl:2.25rem;\n  --text-4xl:3rem;\n  --text-5xl:4rem;\n  --text-6xl:5.5rem;\n  --text-7xl:7rem;\n\n  --weight-light:300;\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n\n  /* leading — the deck's own titles run tight (huge type, autofit-shrunk line box);\n     body copy stays generous, CJK body a touch more so. */\n  --leading-tight:0.95;\n  --leading-title:1.15;\n  --leading-body:1.6;\n  --leading-cjk:1.75;\n\n  /* tracking — the eyebrow/label role is the deck's one deliberately-tracked run\n     (spc=\"561\" on a 16.5pt run = 0.34em); the CJK subtitle carries a much lighter\n     0.06em (spc=\"135\" on 22.5pt). Everything else in the deck ships at 0 tracking —\n     no bold, no letter-spacing anywhere except those two roles. */\n  --tracking-title:-0.01em;\n  --tracking-cjk-title:0.06em;\n  --tracking-body:0;\n  --tracking-label:0.34em;   /* bold uppercase eyebrow — matches the deck exactly */\n  --tracking-mono:0.02em;\n\n  /* composed roles — headings are regular weight by design: the deck creates hierarchy with\n     SIZE and COLOUR, not boldness. Bold is reserved for the one eyebrow/label role. */\n  --type-poster-title:var(--weight-regular) var(--text-6xl)/var(--leading-tight) var(--font-display);\n  --type-hero:var(--weight-regular) var(--text-7xl)/var(--leading-tight) var(--font-display);\n  --type-h1:var(--weight-regular) var(--text-4xl)/var(--leading-title) var(--font-display);\n  --type-h2:var(--weight-regular) var(--text-2xl)/var(--leading-title) var(--font-display);\n  --type-h3:var(--weight-regular) var(--text-lg)/var(--leading-title) var(--font-ui);\n  --type-body:var(--weight-regular) var(--text-base)/var(--leading-body) var(--font-ui);\n  --type-body-cjk:var(--weight-regular) var(--text-base)/var(--leading-cjk) var(--font-ui);\n  --type-lede:var(--weight-regular) var(--text-lg)/var(--leading-cjk) var(--font-kai);\n  --type-small:var(--weight-regular) var(--text-sm)/var(--leading-body) var(--font-ui);\n  --type-label:var(--weight-bold) var(--text-base)/1.2 var(--font-ui);\n  --type-mono:var(--weight-medium) var(--text-sm)/1.4 var(--font-mono);\n  --numeric-tabular:tabular-nums; /* @kind other */\n}\n<\u002Fstyle>\n  <style>:root{\n  /* 4px base. Odd steps exist because printed/poster work needs the half-steps. */\n  --space-0:0;\n  --space-1:2px;\n  --space-2:4px;\n  --space-3:6px;\n  --space-4:8px;\n  --space-5:12px;\n  --space-6:16px;\n  --space-7:20px;\n  --space-8:24px;\n  --space-9:32px;\n  --space-10:40px;\n  --space-11:56px;\n  --space-12:72px;\n  --space-13:96px;\n  --space-14:128px;\n\n  /* layout */\n  --gutter-page:24px;\n  --gutter-page-lg:56px;\n  --measure:64ch;        /* 拉丁文段落最大寬 */\n  --measure-cjk:34em;    /* 中文段落最大寬（約 34 字） */\n  --width-content:720px;\n  --width-wide:1080px;\n}\n<\u002Fstyle>\n  <style>:root{\n  /* Paper-first brand: radii stay small. Nothing is a pill except tags. */\n  --radius-xs:2px;\n  --radius-sm:4px;\n  --radius-md:8px;\n  --radius-lg:14px;\n  --radius-pill:999px;\n\n  --border-width:1px;\n  --border-width-thick:2px;\n  --rule-hairline:var(--border-width) solid var(--hairline);\n  --rule-on-dark:var(--border-width) solid var(--border-on-dark);\n\n  /* Shadows are warm-tinted and low; cards mostly rely on the hairline instead. */\n  --shadow-none:none;\n  --shadow-xs:0 1px 2px rgba(43,35,24,0.06);\n  --shadow-sm:0 2px 6px -1px rgba(43,35,24,0.08);\n  --shadow-md:0 10px 24px -10px rgba(43,35,24,0.16);\n  --shadow-lg:0 24px 56px -20px rgba(43,35,24,0.24);\n  --shadow-inset-warm:inset 0 1px 0 rgba(255,255,255,0.5);\n  --shadow-stage:0 32px 80px -32px rgba(0,0,0,0.7);\n\n  --focus-ring:0 0 0 3px var(--ring-focus);\n}\n<\u002Fstyle>\n  <style>:root{\n  /* Quiet motion. Fades and 2–6px offsets only — no bounce, no spring, no scale-in. */\n  --duration-instant:90ms; /* @kind other */\n  --duration-fast:150ms; /* @kind other */\n  --duration-base:220ms; /* @kind other */\n  --duration-slow:400ms; /* @kind other */\n  --duration-glow:2400ms; /* @kind other */\n\n  --ease-out:cubic-bezier(0.2,0.6,0.2,1); /* @kind other */\n  --ease-in-out:cubic-bezier(0.4,0,0.2,1); /* @kind other */\n  --ease-standard:var(--ease-out); /* @kind other */\n\n  --transition-control:background-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out),transform var(--duration-instant) var(--ease-out); /* @kind other */\n  --lift-press:translateY(1px); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Minimal element defaults so any consuming page inherits the brand voice without extra work. */\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg-page);color:var(--text-body);font:var(--type-body);text-wrap:pretty}\nh1,h2,h3,h4{color:var(--text-strong);margin:0;text-wrap:balance;font-weight:var(--weight-regular)}\nh1{font:var(--type-h1);letter-spacing:var(--tracking-title)}\nh2{font:var(--type-h2);letter-spacing:var(--tracking-title)}\nh3{font:var(--type-h3)}\np{margin:0 0 var(--space-6)}\na{color:var(--text-link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:0.18em;transition:color var(--duration-fast) var(--ease-out)}\na:hover{color:var(--accent-deep)}\na:active{color:var(--primary-deep)}\na:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-xs)}\nhr{border:0;border-top:var(--rule-hairline);margin:var(--space-9) 0}\ncode,kbd{font:var(--type-mono);letter-spacing:var(--tracking-mono);font-variant-numeric:var(--numeric-tabular)}\n::selection{background:var(--accent);color:var(--ink)}\n:lang(zh),[lang^=\"zh\"]{line-height:var(--leading-cjk)}\n<\u002Fstyle>\n  <style>/* cleared for bundling */\n\n/* HuanYin 弦吟 — colour tokens.\n   Source: uploads/fingerboard analysis.pptx (「指板分析」教學課程投影片，20 頁) — this palette is\n   extracted directly from that deck's actual slide colours, not estimated or invented.\n   Cream/charcoal ground with a single warm amber accent family; no forest green, no indigo. */\n:root{\n  /* ── 中性色 neutrals — 米色/炭色 cream & charcoal from the deck's own slides ── */\n  --canvas:#FAF6EF;\n  --surface-bone:#F0E7D8;\n  --surface-card:#ffffff;\n  --ink:#2E2622;\n  --body:#3F3630;\n  --mute:#6B5B4E;\n  --stone:#C9B9A3;\n  --hairline:rgba(46,38,34,0.12);\n\n  /* ── 深色區塊 stage / night — derived darker steps of --ink for dark panels ── */\n  --surface-dark:#1C1611;\n  --surface-deep:#120E0A;\n  --on-dark:#FAF6EF;\n  --on-dark-mute:rgba(250,246,239,0.72);\n\n  /* ── 主色｜琥珀 amber — the deck's dominant accent (#D97706 / #B45309) ─────── */\n  --primary:#D97706;\n  --primary-deep:#B45309;\n\n  /* ── 副色｜靛藍 indigo — user-preferred cool tone reintroduced from the original palette;\n     NOT from the fingerboard deck (deck is warm-only) — kept because amber/rust/gold read as one\n     repetitive warm family for a three-role s e=\"0px,0px\"><\u002Fdc-import><\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst HYL = window.HYLINK;\nif (!HYL) throw new Error('project-link.js 沒有載入');\nconst NS = HYL.NS + 'chord-';\nconst PROJ_V = 1;\n// 音樂計算在 chord-music.js（在 <head> 先載入）。\nconst HYC = window.HYCH_MUSIC;\nif (!HYC) throw new Error('chord-music.js 沒有載入');\nconst { FRET_OPTS, normF, segsOf, fixAcc, parseName, nameParts, labShown, soundingFrets } = HYC;\n// v2.2：調弦和升降記號拼法都跟著指板（從瀏覽器裡的指板狀態讀）。\nlet LINK = { open: HYC.OPEN, spelling: 'sharp', tuning: HYL.STD_NAME, title: '' };\nlet TOUR_DEMO = false; // 導覽中改用標準調弦\nfunction readLink() { if (TOUR_DEMO) { LINK = { open: HYC.OPEN, spelling: 'sharp', tuning: HYL.STD_NAME, letters: HYL.tuningLetters(null), title: '' }; return; } const fb = HYL.readFb(); LINK = { open: HYL.chordOpen(fb), spelling: HYL.spellingOf(fb), tuning: HYL.tuningName(fb), letters: HYL.tuningLetters(fb), title: fb && fb.d ? fb.d.title || '' : '' }; return LINK; }\nreadLink();\n// 和弦本可以單獨設定調弦（doc.tune = { i: 選單編號, pc: 指板順序第 1 弦→第 6 弦 }）；沒設定＝跟指板連動。\nconst CH_TUNINGS = [\n  { t: 'Standard　E A D G B E', pc: [4, 11, 7, 2, 9, 4] }, { t: 'Drop D　D A D G B E', pc: [4, 11, 7, 2, 9, 2] },\n  { t: 'DADGAD', pc: [2, 9, 7, 2, 9, 2] }, { t: 'Open G　D G D G B D', pc: [2, 11, 7, 2, 7, 2] },\n  { t: 'Open D　D A D F♯ A D', pc: [2, 9, 6, 2, 9, 2] }, { t: 'Open C　C G C G C E', pc: [4, 0, 7, 0, 7, 0] },\n  { t: '半音降　E♭ A♭ D♭ G♭ B♭ E♭', pc: [3, 10, 6, 1, 8, 3] }, { t: '全音降　D G C F A D', pc: [2, 9, 5, 0, 7, 2] }\n];\nconst CH_SH = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'], CH_FL = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];\nlet CH_TUNE_SIG = '';\nfunction applyTune(tune) {\n  const sg = JSON.stringify(tune || null) + '|' + TOUR_DEMO;\n  if (sg === CH_TUNE_SIG) return; CH_TUNE_SIG = sg; readLink();\n  if (TOUR_DEMO || !tune || !Array.isArray(tune.pc) || tune.pc.length !== 6) return;\n  const n = LINK.spelling === 'flat' ? CH_FL :
