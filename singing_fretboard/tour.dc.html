<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="tour-text.js"></script>
  
</helmet>
<div data-tour-root="1" ref="{{ rootRef }}" style="position: fixed; inset: 0; z-index: 2000; pointer-events: none; font-family: var(--font-ui); color: var(--ink); opacity: {{ rootOp }}; transition: opacity 600ms cubic-bezier(.2,.6,.2,1);">
  <sc-if value="{{ touring }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 30; pointer-events: auto;"></div>
    <svg style="position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 31; pointer-events: none; opacity: {{ spOp }};">
      <defs>
        <mask id="hyTourMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <rect x="0" y="0" width="100%" height="100%" fill="#fff"></rect>
          <rect x="{{ sp.x }}" y="{{ sp.y }}" width="{{ sp.w }}" height="{{ sp.h }}" rx="4" fill="#000" style="transition: {{ spTr }};"></rect>
          <sc-for list="{{ holes }}" as="h" hint-placeholder-count="0">
            <rect x="{{ h.x }}" y="{{ h.y }}" width="{{ h.w }}" height="{{ h.h }}" rx="4" fill="#000"></rect>
          </sc-for>
        </mask>
      </defs>
      <rect x="0" y="0" width="100%" height="100%" fill="rgba(46,38,34,0.5)" mask="url(#hyTourMask)"></rect>
    </svg>
    <div ref="{{ boxRef }}" style="position: fixed; z-index: 33; left: 0; top: 0; width: 0; height: 0; box-sizing: border-box; border: 1.5px dashed var(--primary); background: rgba(217,119,6,0.08); opacity: 0; pointer-events: none;"></div>
    <div ref="{{ dotRef }}" style="position: fixed; z-index: 33; left: 0; top: 0; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #F1E4CE; border: 1.5px solid #A08566; opacity: 0; pointer-events: none;"></div>
    <div ref="{{ keyRef }}" style="position: fixed; z-index: 33; left: 0; top: 0; width: 96px; height: 34px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: var(--font-latin); font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); background: var(--surface-card); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: 0 3px 0 var(--border-strong); opacity: 0; pointer-events: none;">Space</div>
    <div ref="{{ fingerRef }}" style="position: fixed; z-index: 34; left: 0; top: 0; width: 22px; height: 30px; opacity: 0; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));">
      <svg width="22" height="30" viewBox="0 0 22 30"><path d="M1.5 1.5 L1.5 23.5 L7 18.3 L10.6 27 L14.2 25.5 L10.7 17 L18.2 17 Z" fill="#000000" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path></svg>
    </div>
    <div ref="{{ groupRef }}" style="position: fixed; z-index: 32; pointer-events: auto; left: {{ gp.x }}px; top: {{ gp.y }}px; width: 400px; max-width: calc(100vw - 24px); display: flex; align-items: flex-start; gap: 14px; opacity: {{ gpOp }}; transition: {{ gpTr }};">
      <div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <img src="assets/tour-avatar.jpg" alt="桓吟" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface-card); box-shadow: var(--shadow-md);">
        <span style="padding: 1px 8px; font-family: var(--font-cjk); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink); background: var(--surface-card); border: 1px solid var(--hairline); border-radius: 999px;">桓吟</span>
      </div>
      <div style="position: relative; flex: 1; min-width: 0; box-sizing: border-box; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-card); border: 1px solid var(--hairline); border-radius: 14px; box-shadow: var(--shadow-lg);">
        <span style="position: absolute; left: -7px; top: 24px; width: 12px; height: 12px; background: var(--surface-card); border-left: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); transform: rotate(45deg);"></span>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
          <span style="flex: 1; min-width: 0; display: block; font-family: var(--font-cjk); font-size: 15px; font-weight: 700; line-height: 1.5; text-wrap: pretty; letter-spacing: var(--tracking-cjk-title);">{{ cur.title }}</span>
          <span style="flex: none; font-family: var(--font-latin); font-size: 12px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums;">{{ stepLabel }}</span>

        <span style="font-family: var(--font-cjk); font-size: 13px; line-height: 1.9; text-wrap: pretty; white-space: pre-line;">{{ cur.body }}</span>
        <div style="display: flex; gap: 4px;">
          <sc-for list="{{ pips }}" as="p" hint-placeholder-count="6">
            <span style="flex: 1; height: 3px; border-radius: 2px; background: {{ p.c }};"></span>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <button type="button" onClick="{{ onSkip }}" style="padding: 6px 2px; font-family: var(--font-cjk); font-size: 13px; color: var(--mute); background: transparent; border: none; cursor: pointer;">略過</button>
          <div style="display: flex; gap: 6px;">
            <sc-if value="{{ notFirst }}" hint-placeholder-val="{{ false }}">

            </sc-if>
            <button type="button" onClick="{{ onNext }}" style="padding: 7px 16px; white-space: nowrap; font-family: var(--font-cjk); font-size: 13px; font-weight: 600; color: #FBEFD9; background: var(--ink); border: 1px solid var(--ink); border-radius: var(--radius-sm); cursor: pointer;">{{ nextLabel }}</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

  go(d) { const n = TOURS[this.state.app].length, s = this.state.step + d; if (s >= n) { try { window.hyTrack && window.hyTrack('tour_complete'); } catch (e) {} this.stop(); } else this.show(Math.max(0, s)); }
  stop() { try { window.HY_TOUR && window.HY_TOUR.closeDlg && window.HY_TOUR.closeDlg(); } catch (e) {} this.stopFinger(); this.setState({ step: -1, sp: null, gp: null, ready: false }); this._hadSp = false; this.leave(); if (this.props.onClose) this.props.onClose(); }
  renderVals() {
    const st = this.state, list = TOURS[st.app], touring = st.step >= 0;
    const cur = touring ? list[st.step] : { title: '', body: '' };
    return {
      rootRef: this.rootRef, groupRef: this.groupRef, fingerRef: this.fingerRef, keyRef: this.keyRef, boxRef: this.boxRef, dotRef: this.dotRef,
      rootOp: st.ready ? 1 : 0,
      gpOp: this._entering && st.gp && st.gp.x < -400 ? 0 : 1,
      gpTr: this._entering ? 'left 600ms cubic-bezier(.2,.6,.2,1), top 600ms cubic-bezier(.2,.6,.2,1), opacity 600ms cubic-bezier(.2,.6,.2,1)' : 'left 260ms cubic-bezier(.2,.6,.2,1), top 260ms cubic-bezier(.2,.6,.2,1)',
      touring, cur, sp: st.sp || { x: 0, y: 0, w: 0, h: 0 }, holes: st.holes || [], gp: st.gp || { x: -9999, y: 0 },
      spOp: st.sp ? 1 : 0, spTr: (() => { const T = 'x 260ms cubic-bezier(.2,.6,.2,1), y 260ms cubic-bezier(.2,.6,.2,1), width 260ms cubic-bezier(.2,.6,.2,1), height 260ms cubic-bezier(.2,.6,.2,1)'; const had = this._hadSp; this._hadSp = !!st.sp; return had && st.sp ? T : 'none'; })(),
      stepLabel: (st.step + 1) + ' / ' + list.length,
      pips: list.map((_, i) => ({ c: i <= st.step ? 'var(--primary)' : 'var(--hairline)' })),
      notFirst: st.step > 0, nextLabel: st.step === list.length - 1 ? '完成' : '下一步',
      onNext: () => this.go(1), onPrev: () => this.go(-1), onSkip: () => this.stop(),
    };
  }
}
</script>
