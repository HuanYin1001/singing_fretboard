// Safari 縮放校正：Safari 量「有 zoom 的元素」位置時會偏掉，這裡改成跟 Chrome 一樣的畫面座標。
// 其他瀏覽器自動偵測為正常，不做任何事。上線版打包檔 <head> 裡是同一段。
(function () {
  const P = Element.prototype, nat = P.getBoundingClientRect;
  let cal = null;
  function calibrate() {
    if (cal) return cal;
    if (!document.body) return { ok: true };
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:300px;top:200px;width:100px;height:100px;zoom:0.5;visibility:hidden;pointer-events:none;';
    const a = document.createElement('div'), b = document.createElement('div');
    a.style.cssText = 'position:absolute;left:40px;top:40px;width:10px;height:10px;';
    b.style.cssText = 'position:absolute;left:200px;top:200px;width:10px;height:10px;';
    box.appendChild(a); box.appendChild(b); document.body.appendChild(box);
    const ra = nat.call(a), rb = nat.call(b), rx = nat.call(box);
    box.remove();
    // 真正位置：a 在 (300+20, 200+20)，b 在 (300+100, 200+100)，寬 5。
    const Ax = (rb.left - ra.left) / 80, Ay = (rb.top - ra.top) / 80;
    if (Math.abs(Ax - 1) < 0.05 && Math.abs(Ay - 1) < 0.05) return (cal = { ok: true });
    const Bx = ra.left - Ax * 320, By = ra.top - Ay * 220;
    const k = Math.log(Ax) / Math.log(2);
    cal = { ok: false, k: k > 0.05 ? k : 1, ox: Math.abs(1 - Ax) > 1e-6 ? Bx / (1 - Ax) : 0, oy: Math.abs(1 - Ay) > 1e-6 ? By / (1 - Ay) : 0, self: Math.abs(rx.width - 50) > 2 };
    return cal;
  }
  P.getBoundingClientRect = function () {
    const r = nat.call(this), c = calibrate();
    if (c.ok) return r;
    let z = 1, el = c.self ? this : this.parentElement;
    while (el && el.nodeType === 1) { const v = parseFloat(getComputedStyle(el).zoom); if (v && v !== 1) z *= v; el = el.parentElement; }
    if (Math.abs(z - 1) < 0.001) return r;
    z = Math.pow(z, c.k);
    const x = (r.left - c.ox) * z + c.ox, y = (r.top - c.oy) * z + c.oy;
    return new DOMRect(x, y, r.width * z, r.height * z);
  };
})();

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<script>(function(){try{var s=document.createElement('style');s.id='hy-boot';s.textContent='html{background:#FAF6EF}body{visibility:hidden}';document.head.appendChild(s);setTimeout(function(){var e=document.getElementById('hy-boot');if(e)e.remove();},8000);}catch(e){}})();<\u002Fscript>\n<script>try { if (sessionStorage.getItem('hy-intro-seen') === '1') { const st = document.createElement('style'); st.textContent = '[data-hy-intro] > *{display:none!important}'; document.head.appendChild(st); } } catch (e) {}<\u002Fscript>\n<script src=\"02a526ab-79be-48a0-960d-d7a2453a93c2\"><\u002Fscript>\n<script src=\"12aecbe0-b60a-4167-9bf1-737e6237f254\"><\u002Fscript>\n<script>window.HYFB_CONFIG = { ns: 'hy-fb-v2_2-', prevNs: ['hy-fb-v1_8-', 'hy-fb-v1_1-'] };<\u002Fscript>\n<script src=\"a26e4d72-d793-4957-abc4-8f178de14b27\"><\u002Fscript>\n<script src=\"78488fdb-bd6f-4ccb-96d1-7c85a86dacc3\"><\u002Fscript>\n<script src=\"186eaed0-c0b4-4c8e-8594-febb15f8bba5\"><\u002Fscript>\n<script src=\"b5c311aa-b60f-4771-aef9-7b7eb7023f59\"><\u002Fscript>\n<script src=\"696b7015-6db1-4224-8ebd-a7c5067fd178\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>/* cleared for bundling */\n<\u002Fstyle>\n  <style>/* HuanYin 弦吟 — colour tokens.\n   Source: uploads/fingerboard analysis.pptx (「指板分析」教學課程投影片，20 頁) — this palette is\n   extracted directly from that deck's actual slide colours, not estimated or invented.\n   Cream/charcoal ground with a single warm amber accent family; no forest green, no indigo. */\n:root{\n  /* ── 中性色 neutrals — 米色/炭色 cream & charcoal from the deck's own slides ── */\n  --canvas:#FAF6EF;\n  --surface-bone:#F0E7D8;\n  --surface-card:#ffffff;\n  --ink:#2E2622;\n  --body:#3F3630;\n  --mute:#6B5B4E;\n  --stone:#C9B9A3;\n  --hairline:rgba(46,38,34,0.12);\n\n  /* ── 深色區塊 stage / night — derived darker steps of --ink for dark panels ── */\n  --surface-dark:#1C1611;\n  --surface-deep:#120E0A;\n  --on-dark:#FAF6EF;\n  --on-dark-mute:rgba(250,246,239,0.72);\n\n  /* ── 主色｜琥珀 amber — the deck's dominant accent (#D97706 / #B45309) ─────── */\n  --primary:#D97706;\n  --primary-deep:#B45309;\n\n  /* ── 副色｜靛藍 indigo — user-preferred cool tone reintroduced from the original palette;\n     NOT from the fingerboard deck (deck is warm-only) — kept because amber/rust/gold read as one\n     repetitive warm family for a three-role split, and the user asked to keep this cool anchor. */\n  --secondary:#26314F;\n  --secondary-deep:#1A2138;\n\n  /* ── 簽名色｜金褐 deep gold — a third warm step seen on tags/labels in the deck ── */\n  --accent:#C98A2A;\n  --accent-deep:#9C6B1D;\n\n  /* ── 额外可選｜松綠 forest · 赭紅 rust — also user-preferred, kept as optional extra tones\n     (not one of the three core roles) so both liked colours stay available. ── */\n  --forest:#1B4B3A;\n  --forest-deep:#123529;\n  --rust:#C2410C;\n  --rust-deep:#9A3412;\n\n  /* ── 語意色 semantic (Gumroad 交易頁 only) ─────── */\n  --success:#2c7a7b;\n  --success-tint:#e1e4d7;\n  --success-deep:#215b5c;\n  --danger:#C00000;\n  --danger-deep:#7F1D1D;\n\n  --link:#B45309;\n  --ring-focus:rgba(180,83,9,0.45);\n  --text-strong:var(--ink);\n  --text-body:var(--body);\n  --text-mute:var(--mute);\n  --text-faint:var(--stone);\n  --text-on-dark:var(--on-dark);\n  --text-on-dark-mute:var(--on-dark-mute);\n  --text-link:var(--link);\n  --text-accent:var(--accent-deep);\n\n  --bg-page:var(--canvas);\n  --bg-sunk:var(--surface-bone);\n  --bg-card:var(--surface-card);\n  --bg-stage:var(--surface-dark);\n  --bg-stage-deep:var(--surface-deep);\n  --bg-forest:var(--primary);\n\n  --border-hairline:var(--hairline);\n  --border-strong:rgba(46,38,34,0.28);\n  --border-on-dark:rgba(250,246,239,0.18);\n}\n<\u002Fstyle>\n  <style>:root{\n  /* families — from uploads/fingerboard analysis.pptx's own slide masters: Barlow Condensed\n     for display, Barlow for UI/body, Noto Sans TC for Chinese in both roles. No serif, no kai —\n     this source is a clean teaching deck, not a literary/programme-note register.\n     COMBINED stacks below (Barlow first, Noto Sans TC fallback) are for ON-SCREEN use only —\n     browsers resolve per-glyph fallback correctly. PPTX export does NOT: it writes whatever\n     font-family string is computed into BOTH <a:latin> and <a:ea> for an entire run, so a run\n     styled with the combined stack gets tagged Barlow even where it's pure Chinese text —\n     opening it in PowerPoint and touching the text reflows it in PowerPoint's own CJK default.\n     Any deck/template meant for PPTX export MUST use the SINGLE-family tokens below\n     (--font-cjk / --font-latin / --font-latin-display) on separate spans per script —\n     never the combined --font-display/--font-ui/--font-kai/--font-mono stacks for slide text. */\n  --font-display:\"Barlow Condensed\",\"Noto Sans TC\",sans-serif;   /* on-screen only — 標題、海報、大字級 */\n  --font-kai:\"Barlow\",\"Noto Sans TC\",sans-serif;                 /* on-screen only — italic lede/quote register */\n  --font-ui:\"Barlow\",\"Noto Sans TC\",system-ui,sans-serif;        /* on-screen only — 介面、按鈕、表單、說明 */\n  --font-mono:\"Barlow\",\"Noto Sans TC\",sans-serif;                /* on-screen only — Capo / 弦數 / 拍號 / 時間碼 / 價格 */\n\n  /* SINGLE-family tokens — REQUIRED for any text in a deck/template that will be exported to\n     PPTX. Put Chinese runs in --font-cjk, Latin/number runs in --font-latin (or\n     --font-latin-display for the condensed headline face), each in its OWN span. Never mix\n     scripts inside one span when authoring for export. */\n  --font-cjk:\"Noto Sans TC\",sans-serif;\n  --font-latin:\"Barlow\",sans-serif;\n  --font-latin-display:\"Barlow Condensed\",sans-serif;\n\n  /* scale — 1rem = 16px. Recalibrated directly from slide1.xml's run sizes:\n     eyebrow/meta 16.5pt, CJK subtitle 22.5pt, lede 20.25pt, byl ge.js 或 project-link.js 沒有載入');\nconst { SHARP, FLAT, FLATKEYS, SCALES, TUNINGS, CHROM_DEG, NAT, NATL, MARK1, MARK2 } = HYM;\nconst LABELMODES = ['音名＋級數', '音名', '級數', '無'];\nconst SIZES = [{ s: 1, t: '1×　1440px', note: '網頁、簡報用' }, { s: 2, t: '2×　2880px', note: '講義列印（建議）' }, { s: 3, t: '3×　4320px', note: '大圖輸出' }];\n\nconst REEL_H = 26, REEL_WIN = 42, REEL_C = (REEL_WIN - REEL_H) / 2;\nconst HW = 1180, HH = 296, PHW = 986;\n// 最多 15 格。超過 13 格時每格維持 13 格時的寬度、指板往右延伸（不擠格子）；86＝空弦欄 74＋間距 12。\nconst FRETS_MAX = 15, RR = n => 1 - Math.pow(2, -n / 12);\nconst hwOf = n => n > 13 ? Math.round(HW + (HW - 86) * (RR(n) / RR(13) - 1)) : HW;\nconst VW = 350, VL = 880, VSX = 52;\nconst { LS_NS, PROJ_V, LS_SCHEMA_V } = HYS;\nconst LS_FAV = HYS.KEYS.fav, LS_SAVE = HYS.KEYS.save, LS_STATE = HYS.KEYS.state, LS_EXP = HYS.KEYS.exp, LS_FBSIG = HYLINK.NS + 'fb-savedSig';\nHYS.migrateNS();\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const keyPc = 0, scaleId = 0, frets = this.props.defaultFrets || 13;\n    this.state = {\n      keyPc, scaleId, frets, shift: 0, pitchAbs: true, selStr: null, dirty: false,\n      brush: 1, brushPicked: false, eraser: false, sel: null, chordMenu: null, intro: (() => { try { return sessionStorage.getItem('hy-intro-seen') !== '1'; } catch (e) { return true; } })(), hasRoot: false, labelMode: 1,\n      tuningPc: TUNINGS[0].pc.slice(), tuningName: TUNINGS[0].t, tuningId: '0',\n      title: '指板圖',\n      titleEn: 'Fretboard',\n      notes: {},\n      hist: [], future: [], scale: 1, boardW: 0, boxW: 0, vert: false, altDown: false, editT: false, editE: false,\n      rootNat: 0, acc: 0, exportOpen: false, fileDlgOpen: false, cols: 4, fmt: 'png', size: 2,\n      cursorOn: true, hoverK: null,\n      exportTrans: false, exportLogo: true, renameIdx: -1, renameVal: '',\n      slotA: null, slotB: null, active: null,\n      favs: [], saves: [], saveName: '', favOpen: false, favName: '', loadSel: '', hintOpen: false,\n      colorNames: ['', '', '', '', '', '', '', ''], exportVert: false, favRename: -1,\n      legendOrder: [], shapes: {}, noteShapes: {}, shapePicker: null,\n      shellW: 1440, shellH: 900, shellK: 1, fitW: 1440, fitH: 900,\n      isPhoneMode: false, mobileStep: 'board', mobileMenuOpen: false, fbFit: false, panX: 0, rot: false,\n      rotateHintOff: !!this.loadLS(LS_NS + 'rotateHintOff'), phoneNoteOff: (() => { try { return sessionStorage.getItem('hy-phone-note') === '1'; } catch (e) { return false; } })(), brushBarOpen: false, safePad: '0px',\n      dragStr: null, dragStartY: 0, dragBaseT: 0, dragTranslate: 0,\n      freePos: this.migrateFreePos(this.loadLS(LS_NS + 'freePos')),\n      freeDrag: null, freeStartX: 0, freeStartY: 0, freeBaseX: 0, freeBaseY: 0,\n      fileMsg: '專案檔（.json）可備份以及提供不同設備使用。', exportErr: ''\n    };\n    this.boxRef = React.createRef();\n    window.HYSHELL.install(this, { fabDelay: 350 });\n    this._endStroke = () => this.endStroke();\n    this.hBoardRef = React.createRef();\n    this.cmRef = React.createRef();\n    this._selMove = (e) => { const d = this._selDrag; if (!d) return; const c = this.cellAt(e.clientX, e.clientY); if (c) this.setState({ sel: this.mkSel(d.mode, d.a, c) }); };\n    this._pendMove = (e) => {\n      const p = this._pend;\n      if (!p) return;\n      if (!p.moved) {\n        if (Math.hypot(e.clientX - p.x, e.clientY - p.y) < 6) return;\n        const a = this.cellAt(p.x, p.y);\n        if (!a) return;\n        p.moved = true;\n        this._selDrag = { mode: 'rect', a };\n        this.setState({ eraser: false, chordMenu: null });\n      }\n      this._selMove(e);\n    };\n    this._pendUp = (e) => {\n      const p = this._pend;\n      this._pend = null; this._selDrag = null;\n      window.removeEventListener('pointermove', this._pendMove);\n      window.removeEventListener('pointerup', this._pendUp);\n      window.removeEventListener('pointercancel', this._pendUp);\n      if (p && p.moved && e && e.type === 'pointerup' && this.state.sel) this.openChordMenu(e);\n      if (!p || p.moved) return;\n      if (this.state.sel) this.setState({ sel: null });\n      if (p.cell) this.hit(p.cell.i, p.cell.f, p.cell.alt);\n    };\n    this._selUp = (e) => { if (this._selDrag && e && e.type === 'pointerup' && this.state.sel && !this.state.isPhoneMode) this.openChordMenu(e); this._selDrag = null; window.removeEventListener('pointermove', this._selMove); window.removeEventListener('pointerup', this._selUp); window.removeEventListener('pointercancel', this._selUp); };\n    this.shellRef = React.createRef();\n    this.safeRef = React.createRef();\n    this.barRef = React.createRef();\n  }\n\n  // ---------- geometry ----------\n  geo(n) { return HYM.geo(n); }\n\n  // ---------- naming ----------\n  names(keyPc, acc) {\n    return HYM.spelling(keyPc, acc === undefined ? (this.state ? this.state.acc : 0) : acc);\n  }\n\n  degMap(keyPc, scaleId) { return HYM.degMap(keyPc, scaleId); }\n\n  // Degree label for any pitch class, including ones outside the current scale\n  // (manually supplemented notes) — falls back to a chromatic degree name\n  // (e.g. ♭2) relative to the same tonic so it still matches the current dot style.\n  degLabel(deg, ekey, apc) { return HYM.degLabel(deg, ekey, apc); }\n\n  // 空弦沒上色時一律顯示成「空白」色（畫面、匯出一致）；框選轉和弦、圖例仍只看真正的 notes。\n  withOpen(notes) { const n = Object.assign({}, notes); for (let i = 0; i < 6; i++) if (n[i + '-0'] === undefined) n[i + '-0'] = 0; return n; }\n\n  titleFor(keyPc, scaleId) {\n    return this.names(keyPc)[keyPc] + ' ' + SCALES[scaleId].t.split(' ')[0];\n  }\n\n  titleEnFor(keyPc, scaleId) {\n    const parts = SCALES[scaleId].t.split(' ');\n    const en = parts.slice(1).join(' ') || parts[0];\n    return this.names(keyPc)[keyPc] + ' ' + en;\n  }\n\n  tuningText(pc) {\n    const nm = this.names(this.state ? this.state.keyPc : 0);\n    return pc.slice().reverse().map(p => nm[p]).join(' ');\n  }\n\n  ekeyOf(keyPc, shift) { return HYM.ekeyOf(keyPc, shift); }\n\n  fillT(keyPc, scaleId, tun, frets, shift) { return HYM.fillT(keyPc, scaleId, tun, frets, shift); }\n\n  prune(notes, frets) { return HYM.prune(notes, frets); }\n\n  // ---------- edits ----------\n  histSnap(s) {\n    return { keyPc: s.keyPc, rootNat: s.rootNat, acc: s.acc, scaleId: s.scaleId, title: s.title, titleEn: s.titleEn, notes: s.notes, noteShapes: s.noteShapes,\n      shift: s.shift, pitchAbs: s.pitchAbs, tuningPc: s.tuningPc, tuningName: s.tuningName, tuningId: s.tuningId, dirty: s.dirty };\n  }\n\n  histRestore(p) {\n    const o = { keyPc: p.keyPc, rootNat: p.rootNat, acc: p.acc, scaleId: p.scaleId, title: p.title, titleEn: p.titleEn, notes: p.notes, noteShapes: p.noteShapes, fillSig: null };\n    if (p.shift !== undefined) Object.assign(o, { shift: p.shift, pitchAbs: p.pitchAbs, tuningPc: p.tuningPc, tuningName: p.tuningName, tuningId: p.tuningId });\n    if (p.dirty !== undefined) o.dirty = p.dirty;\n    return o;\n  }\n\n  keyF(k) {\n    const j = k.indexOf('-');\n    return [+k.slice(0, j), +k.slice(j + 1)];\n  }\n\n  push(next, shp) {\n    this.setState(s => ({ hist: s.hist.concat([this.histSnap(s)]).slice(-60), future: [], notes: next, noteShapes: shp || s.noteShapes, dirty: true }));\n  }\n\n  // Single source of truth for recomputing the board when capo, frets, tuning or\n  // pitch mode change. Not dirty: auto-fill. Dirty: translate the user's notes the\n  // same way auto-fill would move (see below); nothing is ever deleted.\n  recomputeBoard(s, params) {\n    const p = Object.assign({ frets: s.frets, shift: s.shift, tuningPc: s.tuningPc, pitchAbs: s.pitchAbs, keyPc: s.keyPc, scaleId: s.scaleId }, params);\n    if (!this.filling(s) || s.dirty) {\n      // 編輯過的指板跟自動套入一樣移動：Capo 平移整張；調弦依每條弦的音高變化反向平移（取最小半音差）。\n      // 超出指板（含第 0 格以下）的點不刪，只是不顯示，移回來就還在。\n      const dShift = p.shift - s.shift;\n      const dStr = [0, 1, 2, 3, 4, 5].map(i => ((((p.tuningPc[i] - s.tuningPc[i]) % 12) + 18) % 12) - 6);\n      const notes = {}, noteShapes = {}, src = s.noteShapes || {};\n      Object.keys(s.notes).forEach(k => {\n        const [i, f] = this.keyF(k);\n        const nk = i + '-' + (f + dShift - dStr[i]);\n        notes[nk] = s.notes[k];\n        if (src[k]) noteShapes[nk] = src[k];\n      });\n      return { notes, noteShapes };\n    }\n    const notes = this.filterNotes({ notes: this.fillT(p.keyPc, p.scaleId, p.tuningPc, p.frets, p.shift, p.pitchAbs) }, p.frets);\n    return { notes, noteShapes: {} };\n  }\n\n  // v2.4.2：套入／清空不再是模式。按「清空音階」會把 dirty 設成 true，之後 Capo／調弦只移動現有圓點、不自動補音。\n  filling(s) {\n    return s.hasRoot;\n  }\n\n  clearRoot() {\n    this.setState(s => ({\n      hasRoot: false, labelMode: 1, notes: {}, noteShapes: {}, shapes: {}, dirty: false, loadSel: '',\n      hist: s.hist.concat([this.histSnap(s)]).slice(-60), future: [],\n      title: '指板圖', titleEn: 'Fretboard'\n    }));\n  }\n\n  // 換主音／音階時：指板上已有圓點就原樣保留（音名、級數自動照新音階重算，音階外的音照樣標級數），\n  // 不補新音階的音；要完全換成新音階，再按一次「套入音階」。指板是空的、而且不是自己清空的（dirty）才自動填入。\n  keepBoard(s, keyPc, scaleId) {\n    if (Object.keys(s.notes).length || s.dirty) return { notes: s.notes, noteShapes: s.noteShapes, shapes: s.shapes, dirty: s.dirty, fillSig: s.fillSig == null ? s.keyPc + '-' + s.scaleId : s.fillSig };\n    return {\n      notes: !s.hasRoot ? {} : this.fillT(keyPc, scaleId, s.tuningPc, s.frets, s.shift, s.pitchAbs),\n      noteShapes: {}, shapes: {}, dirty: false, fillSig: s.hasRoot ? keyPc + '-' + scaleId : null\n    };\n  }\n\n  pickScale(scaleId) {\n    this.setState(s => Object.assign({\n      scaleId, loadSel: '', renameIdx: -1, renameVal: '',\n      hist: s.hist.concat([this.histSnap(s)]).slice(-60), future: [],\n      title: this.titleFor(s.keyPc, scaleId),\n      titleEn: this.titleEnFor(s.keyPc, scaleId)\n    }, this.keepBoard(s, s.keyPc, scaleId)));\n  }\n\n  // fill = true 套入音階（整張重填）；false 清空音階（清空並記成 dirty，換主音／音階保持空白）。按一次做一次。\n  reset(keyPc, scaleId, fill) {\n    this.setState(s => ({\n      keyPc, scaleId, loadSel: '', renameIdx: -1, renameVal: '',\n      hist: s.hist.concat([this
